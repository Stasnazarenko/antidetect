<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Manager</title>
    <link rel="stylesheet" href="electron-styles.css">
</head>
<body>
    <header>
        <h1>🌐 Proxy Manager</h1>
        <button onclick="window.close()" style="float:right;">✖️ Close</button>
    </header>
    <div class="container">
        <div id="proxies-list"></div>
        <button id="add-proxy-btn" class="btn btn-success">Add Proxy</button>
    </div>
    <div id="proxy-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h2>Add/Edit Proxy</h2>
            <form id="proxy-form">
                <input type="text" id="proxy-host" placeholder="Host" required>
                <input type="text" id="proxy-port" placeholder="Port" required>
                <input type="text" id="proxy-username" placeholder="Username">
                <input type="text" id="proxy-password" placeholder="Password">
                <select id="proxy-type-select">
                    <option value="http">HTTP/HTTPS</option>
                    <option value="socks5">SOCKS5</option>
                </select>
                <input type="text" id="proxy-tags-input" placeholder="Tags (comma separated)">
                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-success" style="flex: 1;">Save</button>
                    <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeProxyModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    <script src="proxy-manager.js"></script>
</body>
</html>
